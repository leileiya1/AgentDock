name: CI
on:
  # Branch work is validated by its pull request. Restricting push builds to main
  # avoids running the same commit twice after a PR has been opened.
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test: cargo test --workspace
          - os: macos-latest
            test: cargo test --workspace
          # Windows IPC/service supervision is still being completed. Keep every portable
          # contract, protocol, workflow and release-security boundary compiling there now.
          - os: windows-latest
            test: cargo test -p agentflow-contracts -p agentflow-workflow -p agentflow-provider-protocol -p agentflow-release-engine -p agentflow-git-engine
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: ${{ matrix.test }}

  # The desktop backend is excluded from the Rust workspace, so `cargo test --workspace`
  # never reaches it. Its security boundaries (installer allowlist, Keychain services) and
  # its macOS-only security-framework code need a macOS runner to compile at all.
  desktop-backend-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
        working-directory: apps/desktop
      # Tauri's build script needs the host-target-suffixed sidecar to exist.
      - run: bun run prepare:sidecar
        working-directory: apps/desktop
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  desktop-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
        working-directory: apps/desktop
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Tauri requires a host-target-suffixed sidecar even when xtask only
      # launches the desktop binary to export TypeScript bindings.
      - run: bun run prepare:sidecar
        working-directory: apps/desktop
      # Drift guard: regenerating must change nothing. Snapshotting the generated trees
      # (paths + content hashes) also catches a NEW generated file, which the previous
      # `git diff --exit-code` could never see because an untracked file is invisible to it.
      - name: Snapshot generated contracts
        run: |
          find apps/desktop/src/generated packages/schemas/generated -type f 2>/dev/null \
            | sort | xargs shasum > /tmp/contracts-before.txt
      - run: cargo run -p xtask
      - name: Fail on generated contract drift
        run: |
          find apps/desktop/src/generated packages/schemas/generated -type f 2>/dev/null \
            | sort | xargs shasum > /tmp/contracts-after.txt
          diff /tmp/contracts-before.txt /tmp/contracts-after.txt
      - run: bun run typecheck
        working-directory: apps/desktop
      - run: bun test
        working-directory: apps/desktop

  desktop-visual-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
        working-directory: apps/desktop
      - run: bunx playwright install chromium
        working-directory: apps/desktop
      - run: bun run test:visual
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: desktop-visual-report
          path: apps/desktop/playwright-report
