[package]
name = "agentflow-desktop"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentflow-contracts = { path = "../../../crates/contracts" }
agentflow-daemon = { path = "../../../crates/daemon" }
agentflow-orchestrator = { path = "../../../crates/orchestrator" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
specta = { version = "2.0.0-rc.25", features = ["derive", "chrono", "serde_json"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript"] }
tokio = { version = "1", features = ["full"] }
which = "8"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tempfile = "3"

# This crate is excluded from the workspace (Tauri needs its own build), so the workspace
# lint levels do not reach it automatically. Keep them in sync by hand: the desktop backend
# holds security boundaries (installer allowlist, Keychain services) that must not regress.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
